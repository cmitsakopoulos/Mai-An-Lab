group 'com.flet.flet_audio_service'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.flet.flet_audio_service'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
    }
}

// audio_service requires the host activity to use audio_service's CACHED
// FlutterEngine; not just any FlutterFragmentActivity. The audio_service
// plugin ships an `AudioServiceFragmentActivity` helper that overrides
// `provideFlutterEngine` to return the cached engine. Without this, the
// plugin throws "The Activity class declared in your AndroidManifest.xml is
// wrong or has not provided the correct FlutterEngine."
//
// Flet's template generates a vanilla MainActivity extending FlutterActivity
// and there's no Flet config to customize it; so we patch the file at build
// time before Kotlin compilation. Idempotent: skips if already patched.
// Fix duplicate libc++_shared.so files when numpy/seaborn/matplotlib are used
// This is executed during the configuration/evaluation phase of the build.
rootProject.subprojects { proj ->
    if (proj.path == ':app') {
        // 1. Task-based JNI duplicate cleanup during execution phase
        proj.tasks.matching { it.name.startsWith('merge') && it.name.endsWith('NativeLibs') }.configureEach { task ->
            task.doFirst {
                println "flet_audio_service: Running pre-merge cleanup of duplicate libc++_shared.so files..."
                try {
                    def jniDir = new File(proj.projectDir.parentFile.parentFile, "build/flet_audio_service/intermediates/library_jni")
                    if (jniDir.exists()) {
                        fileTree(jniDir) {
                            include '**/libc++_shared.so'
                        }.each { file ->
                            println "flet_audio_service: Deleting duplicate libc++_shared.so: ${file.absolutePath}"
                            file.delete()
                        }
                    }
                } catch (Exception e) {
                    println "flet_audio_service: Failed to clean up duplicate libc++_shared.so: ${e.message}"
                }
            }
        }

        // 2. Physical file patcher as a permanent self-healing backup
        try {
            def buildFile = file("${proj.projectDir}/build.gradle.kts")
            if (buildFile.exists()) {
                def content = buildFile.text
                if (!content.contains('pickFirsts.add("lib/arm64-v8a/libc++_shared.so")')) {
                    // Clean up any old partial patch first
                    if (content.contains('pickFirsts.add("**/libc++_shared.so")')) {
                        content = content.replace('            pickFirsts.add("**/libc++_shared.so")\n', '')
                        content = content.replace('            pickFirsts.add("**/libc++_shared.so")', '')
                    }
                    def target = 'useLegacyPackaging = true'
                    def replacement = '''useLegacyPackaging = true
            pickFirsts.add("lib/arm64-v8a/libc++_shared.so")
            pickFirsts.add("lib/armeabi-v7a/libc++_shared.so")
            pickFirsts.add("lib/x86/libc++_shared.so")
            pickFirsts.add("lib/x86_64/libc++_shared.so")
            pickFirsts.add("**/libc++_shared.so")'''
                    if (content.contains(target)) {
                        buildFile.text = content.replace(target, replacement)
                        println "flet_audio_service: successfully patched app/build.gradle.kts to handle libc++_shared.so"
                    }
                }
            }
        } catch (Exception e) {
            println "flet_audio_service: failed to patch app/build.gradle.kts: ${e.message}"
        }
    }
}

project.gradle.projectsEvaluated {
    rootProject.allprojects.each { proj ->
        if (proj.path == ':app') {
            proj.tasks.matching { it.name == 'preBuild' }.configureEach {
                doFirst {
                    fileTree(proj.projectDir) {
                        include '**/MainActivity.kt'
                        include '**/MainActivity.java'
                    }.each { file ->
                        def content = file.text
                        if (content.contains('AudioServiceFragmentActivity')) {
                            return  // already patched
                        }
                        if (content.contains('FlutterActivity') ||
                            content.contains('FlutterFragmentActivity')) {
                            println "flet_audio_service: patching ${file.name} → AudioServiceFragmentActivity"
                            file.text = content
                                .replace(
                                    'io.flutter.embedding.android.FlutterFragmentActivity',
                                    'com.ryanheise.audioservice.AudioServiceFragmentActivity')
                                .replace(
                                    'io.flutter.embedding.android.FlutterActivity',
                                    'com.ryanheise.audioservice.AudioServiceFragmentActivity')
                                .replace(': FlutterFragmentActivity()',
                                         ': AudioServiceFragmentActivity()')
                                .replace(': FlutterActivity()',
                                         ': AudioServiceFragmentActivity()')
                                .replace('extends FlutterFragmentActivity',
                                         'extends AudioServiceFragmentActivity')
                                .replace('extends FlutterActivity',
                                         'extends AudioServiceFragmentActivity')
                        }
                    }

                    // Patch AndroidManifest's MainActivity windowSoftInputMode
                    // from `adjustResize` to `adjustNothing`. With adjustResize
                    // the Flet layout reflows every time the keyboard opens,
                    // which makes search-bar containers (and any container with
                    // `animate=Animation`) tween visibly. adjustNothing keeps
                    // the layout stable and lets the keyboard overlay content
                    // ; fine because the search bar is at the top of the page
                    // and never hidden by the keyboard.
                    fileTree(proj.projectDir) {
                        include '**/AndroidManifest.xml'
                        exclude '**/build/**'
                    }.each { file ->
                        def content = file.text
                        if (content.contains('android:windowSoftInputMode="adjustResize"')) {
                            println "flet_audio_service: patching ${file.name} → windowSoftInputMode=adjustNothing"
                            file.text = content.replace(
                                'android:windowSoftInputMode="adjustResize"',
                                'android:windowSoftInputMode="adjustNothing"',
                            )
                        }
                    }
                }
            }
        }
    }
}
