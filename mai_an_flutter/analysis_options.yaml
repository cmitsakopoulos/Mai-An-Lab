# Flutter's recommended lints, plus the Dart team's strict type checks
# (dart.dev/tools/analysis#enabling-additional-type-checks): no implicit
# casts from dynamic, no inference that silently falls back to dynamic, no
# raw generic types. JSON goldens and isolate messages are the places where
# a dynamic value would otherwise slip through unchecked.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
